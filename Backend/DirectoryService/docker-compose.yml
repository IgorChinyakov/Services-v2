services:
  directory-service:
    container_name: directory_service_api
    image: ${DIRECTORY_SERVICE_IMAGE:-directory-service:local}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080

      Postgres__ConnectionString: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:?POSTGRES_DB is required};
        Username=${POSTGRES_USER:?POSTGRES_USER is required};
        Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      Seq__ServerUrl: http://seq:5341

      Redis__ConnectionString: redis:6379

      DepartmentCleanup__Enabled: ${DEPARTMENT_CLEANUP_ENABLED:-true}
      DepartmentCleanup__CronSchedule: ${DEPARTMENT_CLEANUP_CRON_SCHEDULE:-0 0 2 * * ?}
      DepartmentCleanup__RetentionDays: ${DEPARTMENT_CLEANUP_RETENTION_DAYS:-30}
      DepartmentCleanup__BatchSize: ${DEPARTMENT_CLEANUP_BATCH_SIZE:-100}

    ports:
      - "${DIRECTORY_SERVICE_HTTP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      redis:
        condition: service_healthy
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: directory_service_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  seq:
    image: ${SEQ_IMAGE:-datalust/seq:latest}
    container_name: directory_service_seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_FIRSTRUN_NOAUTHENTICATION:-true}
    ports:
      - "${SEQ_HTTP_PORT:-8081}:80"
      - "${SEQ_INGESTION_PORT:-5343}:5341"
    volumes:
      - seq_data:/data

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: directory_service_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  seq_data:
  redis_data:
