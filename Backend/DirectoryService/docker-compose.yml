services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - directory_network

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - directory_network

  seq:
    image: ${SEQ_IMAGE:-datalust/seq:latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_FIRSTRUN_NOAUTHENTICATION:-true}
    volumes:
      - seq_data:/data
    networks:
      - directory_network

  backend:
    image: ${DIRECTORY_SERVICE_IMAGE:-directory-service:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsAtStartup: "true"
      Postgres__ConnectionString: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:?POSTGRES_DB is required};
        Username=${POSTGRES_USER:?POSTGRES_USER is required};
        Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Seq__ServerUrl: http://seq:5341
      Redis__Enabled: ${REDIS_ENABLED:-true}
      Redis__ConnectionString: redis:6379
      Redis__ConnectTimeoutMilliseconds: ${REDIS_CONNECT_TIMEOUT_MILLISECONDS:-1000}
      Redis__OperationTimeoutMilliseconds: ${REDIS_OPERATION_TIMEOUT_MILLISECONDS:-1000}
      DepartmentCleanup__Enabled: ${DEPARTMENT_CLEANUP_ENABLED:-true}
      DepartmentCleanup__CronSchedule: ${DEPARTMENT_CLEANUP_CRON_SCHEDULE:-0 0 2 * * ?}
      DepartmentCleanup__RetentionDays: ${DEPARTMENT_CLEANUP_RETENTION_DAYS:-30}
      DepartmentCleanup__BatchSize: ${DEPARTMENT_CLEANUP_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - directory_network

  frontend:
    image: ${FRONTEND_IMAGE:-directory-service-frontend:local}
    build:
      context: ../..
      dockerfile: Backend/DirectoryService/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - directory_network

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - directory_network

volumes:
  postgres_data:
  redis_data:
  seq_data:

networks:
  directory_network:
    driver: bridge
