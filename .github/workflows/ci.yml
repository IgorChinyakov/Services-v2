name: CI

on: ["push", "pull_request"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Show backend files
        run: ls Backend/DirectoryService

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Show .NET info
        working-directory: Backend/DirectoryService
        run: dotnet --info

      - name: Restore backend dependencies
        working-directory: Backend/DirectoryService
        run: dotnet restore DirectoryService.sln

      - name: Build backend
        working-directory: Backend/DirectoryService
        run: dotnet build DirectoryService.sln --configuration Release --no-restore

      - name: Run backend integration tests
        working-directory: Backend/DirectoryService
        run: >-
          dotnet test DirectoryService.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
          --diag vstest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-diagnostics
          retention-days: 7
          path: |
            Backend/DirectoryService/TestResults/
            Backend/DirectoryService/vstest*.log

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: Frontend/directory-service
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend/directory-service
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: /api/
        working-directory: Frontend/directory-service
        run: npm run build

  publish:
    name: Publish Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Check publication conditions
        run: echo "CI passed. Ready to publish Docker images."
