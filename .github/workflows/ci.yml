name: CI

on: ["push", "pull_request"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Show backend files
        run: ls Backend/DirectoryService

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Show .NET info
        run: dotnet --info

      - name: Restore backend dependencies
        working-directory: Backend/DirectoryService
        run: dotnet restore DirectoryService.sln

      - name: Build backend
        working-directory: Backend/DirectoryService
        run: dotnet build DirectoryService.sln --configuration Release --no-restore

      - name: Run backend integration tests
        working-directory: Backend/DirectoryService
        run: dotnet test DirectoryService.sln --configuration Release --no-build
