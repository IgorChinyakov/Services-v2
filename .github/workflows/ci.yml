name: CI

on: ["push", "pull_request"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Show backend files
        run: ls Backend/DirectoryService

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Show .NET info
        working-directory: Backend/DirectoryService
        run: dotnet --info

      - name: Restore backend dependencies
        working-directory: Backend/DirectoryService
        run: dotnet restore DirectoryService.sln

      - name: Build backend
        working-directory: Backend/DirectoryService
        run: dotnet build DirectoryService.sln --configuration Release --no-restore

      - name: Run backend integration tests
        working-directory: Backend/DirectoryService
        run: >-
          dotnet test DirectoryService.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
          --diag vstest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-diagnostics
          retention-days: 7
          path: |
            Backend/DirectoryService/TestResults/
            Backend/DirectoryService/vstest*.log

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: Frontend/directory-service
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend/directory-service
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: /api/
        working-directory: Frontend/directory-service
        run: npm run build

  publish:
    name: Publish images (${{ matrix.arch }})
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./Backend/DirectoryService
          file: ./Backend/DirectoryService/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/igorchinyakov/directory-backend:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Backend/DirectoryService/Dockerfile.frontend
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/
          tags: ghcr.io/igorchinyakov/directory-frontend:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  publish-manifests:
    name: Publish multi-platform tags
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and inspect multi-platform tags
        run: |
          for service in backend frontend; do
            image="ghcr.io/igorchinyakov/directory-$service"
            docker buildx imagetools create \
              --tag "$image:sha-$GITHUB_SHA" \
              "$image:sha-$GITHUB_SHA-amd64" \
              "$image:sha-$GITHUB_SHA-arm64"
            docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          done
